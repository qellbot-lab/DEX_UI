<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="qell-q-title qell-q-desc">
  <title id="qell-q-title">QELL Q Logo Mark</title>
  <desc id="qell-q-desc">A modular pixel-style Q mark for QELL with circuit and AI-inspired details.</desc>
  <defs>
    <linearGradient id="qell-q-tail" x1="72" y1="72" x2="112" y2="112" gradientUnits="userSpaceOnUse">
